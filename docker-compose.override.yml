# Override para desenvolvimento: hot-reload do frontend igual ao backend
# Docker Compose carrega automaticamente este arquivo (docker compose up)
# Para produção use somente: docker compose -f docker-compose.prod.yml up -d --no-build
services:
  backend:
    # Keep compiler output local to the container; host builds cannot remove it.
    volumes:
      - /app/.dev-build
    environment:
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: RecursiveDirectoryUsingDynamicPriorityPolling
  frontend:
    build:
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
    # Webpack honors WATCHPACK_POLLING on Windows/WSL bind mounts.
    command: ["sh", "tools/dev-entrypoint.sh", "sh", "-c", "npm run dev -- --webpack --hostname 0.0.0.0 --port ${UI_HTTP_PORT}"]
    volumes:
      - ./frontend:/app
      - clouds_frontend_node_modules:/app/node_modules
      - /app/.next
